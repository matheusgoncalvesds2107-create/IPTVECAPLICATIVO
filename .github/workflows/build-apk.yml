name: IPTVEC - Gerar APK Android 7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1 - BAIXAR PROJETO
      # ==========================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ==========================================================
      # 2 - JAVA 17
      # ==========================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # 3 - GRADLE
      # ==========================================================

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================================
      # 4 - ANDROIDX
      # ==========================================================

      - name: Criar gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      # ==========================================================
      # 5 - SETTINGS
      # ==========================================================

      - name: Criar settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "IPTVEC"

          include(":app")
          EOF


      # ==========================================================
      # 6 - BUILD PRINCIPAL
      # ==========================================================

      - name: Criar build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


      # ==========================================================
      # 7 - CRIAR PASTAS
      # ==========================================================

      - name: Criar estrutura
        run: |
          mkdir -p app/src/main/java/com/iptvec/mobile
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          # Remove ícones adaptive antigos
          rm -rf app/src/main/res/mipmap-anydpi
          rm -rf app/src/main/res/mipmap-anydpi-v26


      # ==========================================================
      # 8 - APP BUILD.GRADLE
      # ==========================================================

      - name: Criar app/build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {

              namespace 'com.iptvec.mobile'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.iptvec.mobile'

                  // Android 7.0
                  minSdk 24

                  targetSdk 35

                  versionCode 1

                  versionName "1.0.0"
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {

                  jvmTarget = '17'
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.15.0'

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'androidx.activity:activity-ktx:1.10.0'

              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF


      # ==========================================================
      # 9 - NOME DO APLICATIVO
      # ==========================================================

      - name: Criar strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">IPTVEC</string>

          </resources>
          EOF


      # ==========================================================
      # 10 - CORES
      # ==========================================================

      - name: Criar cores.xml
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="iptvec_black">#05070B</color>

              <color name="iptvec_blue">#00A8FF</color>

              <color name="iptvec_cyan">#00C8FF</color>

              <color name="iptvec_white">#FFFFFF</color>

          </resources>
          EOF


      # ==========================================================
      # 11 - TEMA
      # ==========================================================

      - name: Criar tema
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

              </style>

          </resources>
          EOF


      # ==========================================================
      # 12 - ÍCONE IPTVEC
      #
      # IMPORTANTE:
      # Não usa adaptive-icon.
      # Compatível com Android 7.0 / API 24.
      # ==========================================================

      - name: Criar icone IPTVEC
        run: |
          cat > app/src/main/res/drawable/ic_iptvec.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:width="108dp"

              android:height="108dp"

              android:viewportWidth="108"

              android:viewportHeight="108">

              <!-- Fundo -->

              <path

                  android:fillColor="#05070B"

                  android:pathData="M0,0h108v108h-108z" />


              <!-- Antenas -->

              <path

                  android:fillColor="#00A8FF"

                  android:pathData="
                  M27,31
                  L39,20
                  L41,22
                  L31,34
                  Z" />

              <path

                  android:fillColor="#00A8FF"

                  android:pathData="
                  M81,31
                  L69,20
                  L67,22
                  L77,34
                  Z" />


              <!-- TV -->

              <path

                  android:fillColor="#00A8FF"

                  android:pathData="
                  M25,33
                  H83
                  C89,33 93,37 93,43
                  V74
                  C93,80 89,84 83,84
                  H25
                  C19,84 15,80 15,74
                  V43
                  C15,37 19,33 25,33
                  Z" />


              <!-- Tela -->

              <path

                  android:fillColor="#07101A"

                  android:pathData="
                  M26,40
                  H82
                  C85,40 87,42 87,45
                  V72
                  C87,75 85,77 82,77
                  H26
                  C23,77 21,75 21,72
                  V45
                  C21,42 23,40 26,40
                  Z" />


              <!-- Play -->

              <path

                  android:fillColor="#FFFFFF"

                  android:pathData="
                  M47,47
                  L72,60
                  L47,73
                  Z" />


              <!-- Base -->

              <path

                  android:fillColor="#00C8FF"

                  android:pathData="
                  M18,91
                  H90
                  V96
                  H18
                  Z" />

          </vector>
          EOF


      # ==========================================================
      # 13 - MANIFEST
      # ==========================================================

      - name: Criar AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />


              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:label="@string/app_name"

                  android:icon="@drawable/ic_iptvec"

                  android:roundIcon="@drawable/ic_iptvec"

                  android:usesCleartextTraffic="true"

                  android:theme="@style/AppTheme">


                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>

          </manifest>
          EOF


      # ==========================================================
      # 14 - MAIN ACTIVITY
      # ==========================================================

      - name: Criar MainActivity
        run: |
          cat > app/src/main/java/com/iptvec/mobile/MainActivity.kt <<'EOF'
          package com.iptvec.mobile

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {

              private lateinit var webView: WebView


              private fun telaCheia() {

                  window.decorView.systemUiVisibility =

                      View.SYSTEM_UI_FLAG_FULLSCREEN or

                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or

                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or

                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or

                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or

                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }


              @SuppressLint("SetJavaScriptEnabled")

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  telaCheia()


                  webView = WebView(this)


                  webView.settings.apply {

                      javaScriptEnabled = true

                      domStorageEnabled = true

                      mediaPlaybackRequiresUserGesture = false

                      allowFileAccess = true

                      allowContentAccess = true

                      mixedContentMode =
                          WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  }


                  webView.webViewClient =
                      WebViewClient()


                  webView.webChromeClient =
                      WebChromeClient()


                  setContentView(webView)


                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  )
              }


              override fun onWindowFocusChanged(
                  hasFocus: Boolean
              ) {

                  super.onWindowFocusChanged(hasFocus)

                  if (hasFocus) {

                      telaCheia()
                  }
              }


              @Deprecated("Deprecated in Java")

              override fun onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack()

                  } else {

                      super.onBackPressed()
                  }
              }

          }
          EOF


      # ==========================================================
      # 15 - HTML
      # ==========================================================

      - name: Preparar HTML
        shell: bash
        run: |

          DESTINO="app/src/main/assets/index.html"


          if [ -f "$DESTINO" ]; then

              echo "HTML já existe."

              echo "$DESTINO"

          else

              echo "Procurando HTML..."

              HTML=$(find . \
                -type f \
                -iname "*.html" \
                -not -path "./.git/*" \
                -not -path "./app/src/main/assets/*" \
                | head -n 1)


              if [ -n "$HTML" ]; then

                  echo "HTML encontrado:"
                  echo "$HTML"

                  cp "$HTML" "$DESTINO"

              else

                  echo "ERRO: HTML não encontrado."

                  exit 1

              fi

          fi


      # ==========================================================
      # 16 - VERIFICAR ÍCONE
      # ==========================================================

      - name: Verificar icone
        run: |

          echo "Ícone IPTVEC:"

          ls -lh \
            app/src/main/res/drawable/ic_iptvec.xml


      # ==========================================================
      # 17 - VERIFICAR JAVA
      # ==========================================================

      - name: Verificar Java
        run: |

          java -version


      # ==========================================================
      # 18 - GERAR APK
      # ==========================================================

      - name: Gerar APK
        run: |

          gradle :app:assembleDebug --stacktrace


      # ==========================================================
      # 19 - PUBLICAR APK
      # ==========================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4

        with:

          name: IPTVEC-Android-7

          path: app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
