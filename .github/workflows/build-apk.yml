name: EC IPTV - Gerar APK Android 7.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1 - BAIXAR O REPOSITÓRIO
      # ==========================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ==========================================================
      # 2 - CONFIGURAR JAVA 17
      # ==========================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # 3 - CONFIGURAR GRADLE
      # ==========================================================

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================================
      # 4 - CONFIGURAR ANDROIDX
      # ==========================================================

      - name: Criar gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      # ==========================================================
      # 5 - SETTINGS.GRADLE
      # ==========================================================

      - name: Criar settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "EC_IPTV_Android"

          include(":app")
          EOF


      # ==========================================================
      # 6 - BUILD.GRADLE
      # ==========================================================

      - name: Criar build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


      # ==========================================================
      # 7 - CRIAR PASTAS
      # ==========================================================

      - name: Criar estrutura do aplicativo
        run: |
          mkdir -p app/src/main/java/com/eciptv/mobile
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


      # ==========================================================
      # 8 - APP/BUILD.GRADLE
      # ==========================================================

      - name: Criar app/build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {

              namespace 'com.eciptv.mobile'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.eciptv.mobile'

                  /*
                   * ANDROID 7.0
                   * API 24
                   */
                  minSdk 24

                  targetSdk 35

                  versionCode 1

                  versionName "1.0.0"
              }

              /*
               * JAVA 17
               */
              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }

              /*
               * KOTLIN JVM 17
               */
              kotlinOptions {

                  jvmTarget = '17'
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.15.0'

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'androidx.activity:activity-ktx:1.10.0'

              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF


      # ==========================================================
      # 9 - ANDROID MANIFEST
      # ==========================================================

      - name: Criar AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:label="EC IPTV"

                  android:usesCleartextTraffic="true"

                  android:theme="@style/AppTheme">

                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================================
      # 10 - TEMA
      # ==========================================================

      - name: Criar tema
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF


      # ==========================================================
      # 11 - MAIN ACTIVITY
      # ==========================================================

      - name: Criar MainActivity.kt
        run: |
          cat > app/src/main/java/com/eciptv/mobile/MainActivity.kt <<'EOF'
          package com.eciptv.mobile

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {

              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  webView = WebView(this)

                  webView.settings.apply {

                      javaScriptEnabled = true

                      domStorageEnabled = true

                      mediaPlaybackRequiresUserGesture = false

                      allowFileAccess = true

                      allowContentAccess = true

                      mixedContentMode =
                          WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  }

                  webView.webViewClient =
                      WebViewClient()

                  webView.webChromeClient =
                      WebChromeClient()

                  setContentView(webView)

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  )
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack()

                  } else {

                      super.onBackPressed()
                  }
              }
          }
          EOF


      # ==========================================================
      # 12 - PREPARAR O HTML
      # ==========================================================
      #
      # Se o index.html já estiver em:
      #
      # app/src/main/assets/index.html
      #
      # ele será mantido.
      #
      # Caso não esteja, o workflow procura outro HTML no projeto.
      #
      # ==========================================================

      - name: Preparar HTML do aplicativo
        shell: bash
        run: |

          DESTINO="app/src/main/assets/index.html"

          if [ -f "$DESTINO" ]; then

              echo "======================================"
              echo "HTML já está no lugar correto."
              echo "$DESTINO"
              echo "======================================"

          else

              echo "Procurando arquivo HTML..."

              HTML=$(find . \
                -type f \
                -iname "*.html" \
                -not -path "./.git/*" \
                -not -path "./app/src/main/assets/*" \
                | head -n 1)

              if [ -n "$HTML" ]; then

                  echo "HTML encontrado:"
                  echo "$HTML"

                  cp "$HTML" "$DESTINO"

              else

                  echo "ERRO: nenhum arquivo HTML encontrado."

                  echo ""
                  echo "Coloque o HTML do aplicativo no repositório."
                  echo ""

                  exit 1

              fi

          fi


      # ==========================================================
      # 13 - MOSTRAR ESTRUTURA
      # ==========================================================

      - name: Verificar arquivos
        run: |

          echo "======================================"
          echo "ARQUIVOS DO PROJETO"
          echo "======================================"

          find app -type f | sort

          echo ""
          echo "======================================"
          echo "HTML PRINCIPAL"
          echo "======================================"

          ls -lh app/src/main/assets/index.html


      # ==========================================================
      # 14 - VERIFICAR JAVA
      # ==========================================================

      - name: Verificar Java
        run: |
          java -version


      # ==========================================================
      # 15 - GERAR APK
      # ==========================================================

      - name: Gerar APK
        run: |
          gradle :app:assembleDebug --stacktrace


      # ==========================================================
      # 16 - PUBLICAR APK
      # ==========================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4

        with:

          name: EC-IPTV-Android-7

          path: app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
